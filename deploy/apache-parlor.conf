# /etc/httpd/conf.d/zzz-parlor.conf
# Apache front end for Parlor at parlor.cruftmanor.com. Parlor listens on
# 127.0.0.1:8790 only. Install after DNS for parlor.cruftmanor.com points
# here and a certificate covering the name exists (see DEPLOY.md).

<VirtualHost 67.43.2.255:80>
  ServerName parlor.cruftmanor.com
  # ACME HTTP-01 challenges are answered from this directory.
  DocumentRoot /var/www/parlor-acme
  <Directory /var/www/parlor-acme>
    Require all granted
  </Directory>
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://parlor.cruftmanor.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost 67.43.2.255:443>
  ServerName parlor.cruftmanor.com

  SSLEngine on
  SSLCertificateFile    /etc/parlor/tls/fullchain.pem
  SSLCertificateKeyFile /etc/parlor/tls/privkey.pem

  ErrorLog  /var/log/httpd/parlor-error.log
  CustomLog /var/log/httpd/parlor-access.log combined

  # Request size cap (Parlor also caps JSON bodies at 16 KB).
  LimitRequestBody 65536
  # File uploads: 12 MB file plus form overhead, matching the server-wide
  # mod_security SecRequestBodyLimit (12.5 MB). Uploads are multipart, so
  # the file part does not count against SecRequestBodyNoFilesLimit.
  <Location /api/space/upload>
    LimitRequestBody 13107200
  </Location>

  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 60
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass        / http://127.0.0.1:8790/ retry=0
  ProxyPassReverse / http://127.0.0.1:8790/
</VirtualHost>
