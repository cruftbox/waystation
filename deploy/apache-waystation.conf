# /etc/httpd/conf.d/zzz-waystation.conf
# Apache front end for Waystation at waystation.cruftmanor.com. Waystation listens on
# 127.0.0.1:8791 only. Install after DNS for waystation.cruftmanor.com points
# here and a certificate covering the name exists (see DEPLOY.md).

<VirtualHost 67.43.2.255:80>
  ServerName waystation.cruftmanor.com
  # ACME HTTP-01 challenges are answered from this directory.
  DocumentRoot /var/www/waystation-acme
  <Directory /var/www/waystation-acme>
    Require all granted
  </Directory>
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://waystation.cruftmanor.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost 67.43.2.255:443>
  ServerName waystation.cruftmanor.com

  SSLEngine on
  SSLCertificateFile    /etc/waystation/tls/fullchain.pem
  SSLCertificateKeyFile /etc/waystation/tls/privkey.pem

  ErrorLog  /var/log/httpd/waystation-error.log
  CustomLog /var/log/httpd/waystation-access.log combined

  # Request size cap (Waystation also caps JSON bodies at 16 KB).
  LimitRequestBody 65536
  # File uploads: 12 MB file plus form overhead, matching the server-wide
  # mod_security SecRequestBodyLimit (12.5 MB). Uploads are multipart, so
  # the file part does not count against SecRequestBodyNoFilesLimit.
  <Location /api/space/upload>
    LimitRequestBody 13107200
  </Location>

  ProxyRequests Off
  ProxyPreserveHost On
  ProxyTimeout 60
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass        / http://127.0.0.1:8791/ retry=0
  ProxyPassReverse / http://127.0.0.1:8791/
</VirtualHost>
